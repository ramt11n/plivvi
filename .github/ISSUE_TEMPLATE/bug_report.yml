name: Report a bug
description: Help improve a Plivvi tool without uploading private documents.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "This report is public. Never include passwords, recovery phrases, or private documents. For a private report, use Report a bug on https://plivvi.pages.dev/."
  - type: input
    id: tool
    attributes:
      label: Tool or page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Steps to reproduce, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser version
  - type: input
    id: version
    attributes:
      label: Plivvi version (Settings → App version)
