name: Publish open-source project page
on:
  push:
    branches: [main]
    paths: ['project-site/**', '.github/workflows/project-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-project-page
  cancel-in-progress: true
jobs:
  publish:
    if: vars.ENABLE_PROJECT_PAGE == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project-site
      - name: Deploy the project page
        id: deployment
        uses: actions/deploy-pages@v4
