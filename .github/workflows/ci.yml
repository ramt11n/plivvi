name: Check the workshop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_REPO_URL: https://github.com/ramt11n/plivvi
      - run: node scripts/verify-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plivvi-static-site
          path: dist
          retention-days: 7
